<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Günlük bütçe</title>
<style>@font-face{font-family:Nunito;src:url(nunito.ttf) format("truetype");font-weight:200 1000;font-display:swap}

/* ---- Renkler: sıcak krem zemin, mercan vurgu ---- */
:root{--bg:#fbf5ee;--card:#fff;--ink:#2b211c;--mute:#7a6a60;--line:#efe3d6;--soft:#f6ece2;
--acc:#c24a2c;--accink:#fff;--acc2:#fde6dc;--ok:#2f8a55;--okt:#e2f3e8;--bad:#c93a3a;--badt:#fbe1e1;
--shadow:0 2px 12px rgba(120,70,30,.07);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1c1714;--card:#27211c;--ink:#f3e9df;--mute:#b6a598;--line:#3a312a;--soft:#312923;
--acc:#ff8f6b;--accink:#1c1714;--acc2:#432b22;--ok:#5cc489;--okt:#1f3326;--bad:#ff7b72;--badt:#3d2222;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1c1714;--card:#27211c;--ink:#f3e9df;--mute:#b6a598;--line:#3a312a;--soft:#312923;
--acc:#ff8f6b;--accink:#1c1714;--acc2:#432b22;--ok:#5cc489;--okt:#1f3326;--bad:#ff7b72;--badt:#3d2222;--shadow:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;
padding-top:env(safe-area-inset-top,0px)}
main{max-width:460px;margin:0 auto;padding:18px 16px 104px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:4px 4px 14px}
.top h1{font-size:1.45rem;font-weight:800;margin:0;letter-spacing:-.01em}
.top .lab{text-align:right}
h2{font-size:1.2rem;font-weight:800;margin:4px 0 6px}
.hd{font-weight:800;color:var(--ink);font-size:1rem;margin-bottom:10px}
.lab{color:var(--mute);font-size:.92rem}
.tiny{font-size:.78rem}
.big{font-size:3.1rem;font-weight:800;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big.neg{color:var(--bad)}
.num{font-variant-numeric:tabular-nums}
/* ilerleme çubuğu; çizgi = bu saate kadar beklenen */
.bar{position:relative;height:12px;background:var(--soft);border-radius:99px;margin:14px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;background:#3fae6a;transition:width .3s}
.bar.warn i{background:#f2b42c}.bar.slow i{background:#ef7d32}.bar.bad i{background:#e45a5a}
.bar b{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;border-radius:2px;background:var(--ink);opacity:.4}
.bar.thin{height:8px;margin:10px 0 4px}.bar.thin i{background:var(--acc)}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px dashed var(--line);font-size:.95rem}
.row:first-child{border-top:0}
.row>span:first-child{color:var(--mute)}
.row>span:last-child{text-align:right}
.add,.inc{display:flex;gap:8px}
.inc{margin:6px 0}
input,select,textarea{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);border-radius:14px;padding:12px;font:inherit;font-size:1rem}
select{flex:0 1 auto;max-width:42%;padding:0 8px}
textarea{width:100%;min-height:96px;resize:vertical;font-size:.8rem;word-break:break-all;margin-top:8px}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none}
input.dd{flex:0 0 70px}
input.sm{flex:0 0 60px;padding:12px 8px}
button{border:0;background:var(--acc);color:var(--accink);border-radius:14px;padding:12px 18px;font:inherit;font-size:1rem;font-weight:800;cursor:pointer}
button.ghost{background:transparent;color:var(--mute);border:1.5px solid var(--line);font-weight:700}
button.soft{background:var(--acc2);color:var(--acc)}
button.danger{background:var(--bad);color:#fff}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px dashed var(--line)}
.it button{padding:5px 12px;font-size:.9rem}
.it .tm{color:var(--mute);font-size:.85rem;margin-right:6px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:4px 0 8px}
.chip{background:var(--card);color:var(--mute);border:1.5px solid var(--line);padding:5px 12px;font-weight:700;font-size:.86rem;border-radius:99px}
.chip.on{border-color:var(--acc);color:var(--acc);background:var(--acc2)}
.chip.q{background:var(--acc2);color:var(--acc);border-color:transparent}
.plan button{display:block;width:100%;text-align:left;margin-top:8px}
details summary{cursor:pointer;font-weight:800;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"›";float:right;color:var(--mute);transition:transform .2s}
details[open] summary::after{transform:rotate(90deg)}
.f{display:flex;flex-direction:column;gap:5px;margin:12px 0}
.warn{color:var(--bad);font-size:.92rem;margin:8px 0 0}
.note{color:var(--mute);font-size:.92rem;margin:8px 0 0}
.good{color:var(--ok)}
.badge{display:inline-block;background:var(--badt);color:var(--bad);font-weight:800;font-size:.75rem;border-radius:99px;padding:1px 8px;margin-left:4px}
/* ---- Işık ---- */
.lampw{text-align:center;padding:4px 0 2px}
.lamp{--lc:#3fae6a;width:86px;height:86px;border-radius:50%;margin:6px auto 12px;
background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.55) 0 12%,transparent 42%),var(--lc);
box-shadow:0 0 0 10px color-mix(in srgb,var(--lc) 16%,transparent),0 8px 30px color-mix(in srgb,var(--lc) 45%,transparent)}
.lamp.warn,.lamp.slow,.lamp.bad{animation:br 2.6s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.lamp{animation:none!important}.bar i{transition:none}}
.lt{font-size:1.3rem;font-weight:800}
.hr{height:1px;background:var(--line);margin:16px 0 14px}
/* ---- Takvim ---- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:.72rem;color:var(--mute);font-weight:700;padding-bottom:2px}
.cal button{background:var(--soft);color:var(--ink);border:1.5px solid transparent;border-radius:12px;padding:5px 0 4px;font-weight:600;font-size:1rem;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:52px}
.cal .n{font-size:.86rem;font-weight:800}
.cal .v{font-size:.74rem;color:var(--mute);font-variant-numeric:tabular-nums}
.cal .past{opacity:.5}
.cal .zero .v{color:var(--bad)}
.cal .today{border-color:var(--acc);background:var(--acc2)}
.cal .sel{border-color:var(--mute)}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%}
.dots .in{background:var(--ok)}.dots .out{background:var(--bad)}
.leg{display:flex;gap:14px;align-items:center;font-size:.8rem;color:var(--mute);margin-top:8px}
.leg i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
/* ---- Formlar ---- */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.g2 label{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;font-size:.84rem;color:var(--mute);font-weight:700}
.g2 input{width:100%;flex:none}
.colh{display:flex;gap:8px;font-size:.8rem;color:var(--mute);font-weight:700;margin-bottom:-2px}
.colh span:first-child{flex:0 0 70px}
.colh.pq span{flex:0 0 60px}.colh.pq span:first-child{flex:1}.colh.pq::after{content:"";flex:0 0 44px}
.sub{background:var(--soft);border-radius:16px;padding:12px;margin-top:14px}
.sub input{background:var(--card)}
.sw{display:flex;align-items:center;gap:10px;font-weight:700}
.sw input{flex:none;width:22px;height:22px;accent-color:var(--acc)}
.prog{height:6px;background:var(--soft);border-radius:99px;margin-bottom:14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .25s}
.wz p.lab{margin:0 0 14px}
.nav{display:flex;gap:8px;margin-top:18px}
.nav button:last-child{margin-left:auto}
.stack{display:flex;flex-direction:column;gap:8px}
.stack button{text-align:left}
.stack button.ghost{color:var(--ink)}
/* ---- Kartlar ---- */
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ch .cn{font-size:1.1rem;font-weight:800}
.ch .kl{text-align:right}.ch .kl b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.tks{margin:4px 0 0;padding:0;list-style:none}
.tks li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:.92rem}
.tks li span:last-child{color:var(--mute);text-align:right}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{flex:1}
.confirm{background:var(--badt);border-radius:16px;padding:12px;margin-top:12px}
.empty{text-align:center;padding:26px 10px}
.sub.ki{margin-top:16px}.sub.ki .row{padding:4px 0 8px}
.empty .ico{font-size:2.2rem}
.why{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.why summary{font-weight:700;font-size:.92rem;color:var(--mute)}
.why .row{font-size:.9rem;padding:7px 0}
.why .row .num{white-space:nowrap}
/* ---- Alt sekmeler ---- */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs>div{max-width:460px;margin:0 auto;display:flex;justify-content:space-around}
.tab{background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;font-weight:800;padding:6px 12px;border-radius:14px;min-width:68px}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--acc);background:var(--acc2)}
</style>

<body>
<main id="app"></main>
<script>
var EPF=0,EPE="";   /* borç eritme planı formu açık mı · formdaki uyarı */
var SVERR=false,SDY=0;   /* SVERR: kayıt başarısız · SDY: harcama düne ekleniyor */
var CATS=["Yemek","Ulaşım","Eğlence","Fatura","Diğer"];
var PB={},CDX={},MSG2="";   /* PB: takvimde her günün tahmini para akışı · CDX: gün açıklamaları */
var TKF=false,UNDO=null,TKMSG="";
var KEY="butce-v1",S=null,MSG="",EO=0,TAB="bugun",CF=null,DEL=null,LCTX=null,DAY="",LAST=null,KIE=false,KIC=null,PK={};
var $=function(h){document.getElementById("app").innerHTML=h};
function g(id){return document.getElementById(id)}
function val(id){return document.getElementById(id).value}
function on(id,fn){var e=g(id);if(e)e.onclick=fn}
function all(sel,fn){document.querySelectorAll(sel).forEach(function(b){b.onclick=function(){fn(b)}})}
function ld(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function sv(){try{localStorage.setItem(KEY,JSON.stringify(S));SVERR=false}catch(e){SVERR=true}}
/* ---- Yedek: bütün veri tek satırlık bir metin olur (BUTCE1: + base64). Metin cihazdan sadece kullanıcı kopyalarsa çıkar. ---- */
function bkMake(){return "BUTCE1:"+btoa(unescape(encodeURIComponent(JSON.stringify(S))))}
function bkRead(t){
  t=String(t||"").replace(/\s+/g,"");var k=t.indexOf("BUTCE1:");if(k<0)return null;
  try{var o=JSON.parse(decodeURIComponent(escape(atob(t.slice(k+7)))))}catch(e){return null}
  return o&&typeof o.bal=="number"&&Array.isArray(o.inc)&&Array.isArray(o.cards)&&Array.isArray(o.spend)&&o.last?o:null;
}
/* yedeği yükle: arada geçen günlerin gelirleri ve ödemeleri catchUp ile işlenir */
function bkLoad(o){S=o;mig();W=null;CF=null;TAB="bugun";
  MSG2="Yedek yüklendi ("+dm(pd(o.last))+" tarihli)."+(o.last<ymd(t0())?" Aradaki günlerin gelir ve ödemeleri eklendi; o günlerde harcama yaptıysan akşam uzlaştırmayla bakiyeni düzelt.":"");
  sv();show();window.scrollTo(0,0)}
function bkCopy(box){
  var t=bkMake(),done=function(){S.bk=ymd(t0());sv();box.innerHTML='<p class="good" style="margin:10px 0 0">✓ Yedek kopyalandı. Notlar’a ya da kendine mesaj olarak yapıştırıp sakla.</p>'},
   manual=function(){box.innerHTML='<p class="lab" style="margin:10px 0 0">Kopyalanamadı. Aşağıdaki metnin tamamını seçip kopyala:</p><textarea id="bkO" readonly>'+t+'</textarea>';var a=g("bkO");a.focus();a.select()},
   old=function(){var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}a.remove();ok?done():manual()};
  try{navigator.clipboard.writeText(t).then(done,old)}catch(e){old()}
}
/* yükleme kutusu: yapıştır → kontrol → onay → yükle */
function bkLoadUI(box,ask){
  box.innerHTML='<textarea id="bkI" placeholder="Yedek metnini buraya yapıştır (BUTCE1: ile başlar)"></textarea><p class="warn" id="bkE" hidden></p><div class="add" style="margin-top:8px"><button id="bkL">Yükle</button><button class="ghost" id="bkX">Vazgeç</button></div><div id="bkQ"></div>';
  g("bkI").focus();on("bkX",function(){box.innerHTML=""});
  on("bkL",function(){var o=bkRead(val("bkI")),e=g("bkE");
    if(!o){e.textContent="Bu metin bir yedek gibi görünmüyor. Tamamını kopyaladığından emin ol.";e.hidden=false;return}
    e.hidden=true;if(!ask)return bkLoad(o);
    g("bkQ").innerHTML='<div class="confirm" style="margin-top:10px"><b>Şu anki bilgilerin silinsin mi?</b><p class="lab" style="margin:4px 0 10px">Yerine '+dm(pd(o.last))+' tarihli yedekteki bilgiler gelecek. Geri alınamaz.</p><div class="add"><button class="danger" id="bkY">Evet, yükle</button><button class="ghost" id="bkN">Vazgeç</button></div></div>';
    on("bkN",function(){g("bkQ").innerHTML=""});on("bkY",function(){bkLoad(o)})});
}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function t0(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function pd(s){var a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])}
function ad(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function df(a,b){return Math.round((b-a)/864e5)}
function tl(n){return Math.round(n).toLocaleString("tr-TR")+" TL"}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function card(id){return S.cards.filter(function(c){return c.id===id})[0]}
function cname(id){if(id==="kmh")return "Artı Para";var c=card(id);return c?c.n:"Silinen kart"}
function c28(x){return Math.min(31,Math.max(1,Math.round(x||1)))}
function num(v){var s=String(v==null?"":v).trim().replace(/\s|TL|₺/gi,"");if(!s)return null;
  if(s.indexOf(",")>=0)s=s.replace(/\./g,"").replace(",",".");            /* 1.250,50 → 1250.50 */
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");            /* 7.500 → 7500 (binlik nokta) */
  var x=parseFloat(s);return isNaN(x)||!isFinite(x)?null:x}
function nv(x){return String(x).replace(".",",")}                           /* sayıyı forma virgüllü yaz */
function nz(v,d){v=typeof v=="number"?v:parseFloat(v);return isFinite(v)?v:d}   /* sayı değilse varsayılan */
function dim(d){return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()}
/* d, ayın "day" günü mü? 29–31 kısa aylarda ayın son gününe denk gelir */
function isD(d,day){var n=d.getDate();return n==day||(day>n&&n==dim(d))}
function tipNet(){var p=genPays().reduce(function(a,p){return a+p.a},0);     /* normal gün: gelirden düzenli ödemeler çıktıktan sonra */
  return Math.max(0,S.inc.reduce(function(a,i){return a+i[1]},0)-p)*(1-S.res/100)/30}
function hm(ms){var d=new Date(ms);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
var MON=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
var MONL=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
var DAYL=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
function dm(d){return d.getDate()+" "+MON[d.getMonth()]}
function mY(d){return MON[d.getMonth()]+" "+d.getFullYear()}
/* bugünden (dâhil) sonra ayın "day" gününe denk gelen ilk tarih */
function nd(day){var t=t0();for(var k=0;k<=62;k++){var x=ad(t,k);if(isD(x,day))return x}return t}

/* ---- Ödemeler ----
   p.card yoksa: kartsız sabit ödeme, p.day günü elindeki paradan çıkar.
   p.card varsa: o kartın taksiti, kartın ekstre gününde ekstre borcuna eklenir.
   p.left: kaç ödeme kaldı (null = süresiz). n: bu hesapta her ödemenin kaç kez sayıldığı. */
function payOn(d,n,arr){var a=0;S.pay.forEach(function(p,i){if(p.card==null&&isD(d,p.day)&&(p.left==null||(n[i]||0)<p.left)){a+=p.a;n[i]=(n[i]||0)+1;if(arr)arr.push({n:p.n||"Ödeme",a:p.a})}});return a}
function tkOn(cid,n){var a=0;S.pay.forEach(function(p,i){if(p.card===cid&&(p.left==null||(n[i]||0)<p.left)){a+=p.a;n[i]=(n[i]||0)+1}});return a}
function cardPays(id){return S.pay.filter(function(p){return p.card===id})}
function genPays(){return S.pay.filter(function(p){return p.card==null})}
function instLeft(id){return cardPays(id).reduce(function(s,p){return s+(p.left!=null?p.a*p.left:0)},0)}   /* karttaki kalan taksit toplamı: limitten düşer */
/* ---- Kart borcu ödeme planı ----
   plan: "full" her ay tamamı · "min" asgari · "plus" asgariden fazla sabit tutar
   revS/revU: döner (eski) borcun ekstredeki / henüz ekstreye girmemiş kısmı. Yeni harcamalar planın dışında, her ay tam ödenir.
   Asgari oranı (BDDK, 1 Eki 2026): limit ≤ 100.000 TL → %20, üstü → %40.
   Faiz tavanı (TCMB, 1 Eyl 2026, aylık akdi): dönem borcu < 30.000 TL %3,25 · < 180.000 TL %3,75 · üstü %4,25.
   Faize %15 KKDF + %15 BSMV eklenir. Faiz ekstre gününde, ödenmeyen döner borca işler (yaklaşık hesap). */
var TAX=1.30;
function AMR(c){return c.lim>100000?0.40:0.20}
function tierRate(d){return d<30000?3.25:d<180000?3.75:4.25}
function rateOf(c){return c.rate!=null?c.rate:tierRate(c.stmt+c.cur)}
function IE(c){return rateOf(c)/100*TAX}                                       /* vergiler dahil aylık faiz */
function autoPlus(R,ie,amr){if(R<=0)return 0;var an=R*ie/(1-Math.pow(1+ie,-6));return Math.ceil(Math.max(an,amr*R)/50)*50}   /* ~6 ayda bitiren sabit tutar, en az asgari */
/* bu ay döner borçtan ödenecek kısım */
function payR(plan,r,amr,extra){if(r<=0)return 0;if(r<100)return r;return plan=="plus"?Math.min(r,Math.max(extra||0,Math.ceil(amr*r))):Math.ceil(amr*r)}
/* plan bu hâliyle sürerse: kaç ay, toplam faiz */
function payoff(R,plan,ie,amr,extra){var m=0,I=0;while(R>0.5&&m<240){R-=payR(plan,R,amr,extra);m++;if(R>0.5){var it=R*ie;I+=it;R+=it}}return {m:m,I:I}}
function planOf(c,o){o.plan=c.plan||"full";o.ie=IE(c);o.amr=AMR(c);o.xt=c.extra||0;o.pd=(c.paid||0)>=(c.minDue||0)-1&&(c.paid||0)>0;return o}
/* bu ekstre için ödenmesi gereken (plana göre) */
function dueNow(c){if(c.stmt<=0)return 0;if(S.ep)return Math.max(0,(c.minDue||0)-(c.paid||0));if(c.plan=="full"||c.late)return c.stmt;
  var rs=Math.min(c.revS,c.stmt),want=c.stmt-rs+payR(c.plan,rs,AMR(c),c.extra);return Math.max(0,Math.max(want,c.minDue)-c.paid)}
function planBox(c){
  var R=c.revS+c.revU;if(c.plan=="full"&&R<1)return "";
  var nm={full:"Her ay tamamı",min:"Asgari (%"+Math.round(AMR(c)*100)+")",plus:"Asgari+ · her ay "+tl(c.extra||0)}[c.plan];
  var P=payoff(R,c.plan=="full"?"plus":c.plan,IE(c),AMR(c),c.plan=="full"?R:c.extra),done=c.r0>0?Math.max(0,Math.min(1,1-R/c.r0)):0;
  return '<div class="sub"><div class="ch"><b>Ödeme planı</b><span class="lab">'+nm+'</span></div>'
   +'<div class="row" style="border:0"><span>Döner borç</span><span><b class="num">'+tl(R)+'</b>'+(c.ri&&R>0?'<br><span class="lab tiny">faiz işliyor · aylık %'+String(rateOf(c)).replace(".",",")+' + vergiler</span>':'')+'</span></div>'
   +(c.r0>0?'<div class="bar thin"><i style="width:'+Math.round(done*100)+'%;background:#3fae6a"></i></div><div class="lab tiny">Başlangıç '+tl(c.r0)+' · %'+Math.round(done*100)+' kapandı</div>':'')
   +(c.stmt>0?'<div class="row"><span>Bu ekstre için</span><span><b class="num">'+tl(dueNow(c))+'</b> ödenecek<br><span class="lab tiny">bankanın asgarisi '+tl(c.minDue)+(c.paid?' · ödenen '+tl(c.paid):'')+'</span></span></div>':'')
   +(R>=1?'<p class="lab" style="margin:8px 0 0">Bu planla döner borç yaklaşık <b>'+P.m+' ayda</b> biter, toplam faiz yaklaşık <b>'+tl(P.I)+'</b>. Yeni harcamaların her ay tam ödenir.</p>':'')
   +'</div>';
}
/* kart ödemesi: önce ekstre, ekstre içinde önce yeni kısım, sonra döner borç */
function payCard(c,a){
  var x=Math.min(a,c.stmt+c.cur),y=Math.min(x,c.stmt);
  var nonRev=c.stmt-c.revS;c.revS=Math.max(0,c.revS-Math.max(0,y-nonRev));
  var cu=x-y;if(cu>0){var nrU=c.cur-c.revU;c.revU=Math.max(0,c.revU-Math.max(0,cu-nrU))}
  c.stmt-=y;c.cur-=cu;S.bal-=x;c.paid=(c.paid||0)+x;if(c.stmt<=0||c.paid>=c.minDue-1)c.late=false;if(c.stmt<=0)c.ri=false;
  c.nw=Math.min(c.nw||0,Math.max(0,c.stmt+c.cur-c.revS-c.revU));c.adv=Math.min(c.adv||0,c.stmt+c.cur);   /* yeni harcama döner borcu kapsamaz */
  if(S.tk&&x>0)tkPaid(c,x);
}
/* ---- Takla: bir kartın borcunu başka kartın parasıyla ödemek ----
   Bir bankanın kartıyla başka bankanın kart borcu doğrudan ödenemez; yol nakit avans ya da taksitli avans / borç transferidir.
   Nakit avans: faiz çekildiği gün başlar, faizsiz gün yoktur. Tavan aylık %4,25 (TCMB, Kasım 2026), üstüne %30 vergi (KKDF+BSMV).
   Kayıt: S.tk = [{id,d,from,to,a,fee,m:"na"|"tk",rate,n,rem,i,ib,last}]
   rem: nakit avanstan ödenmemiş anapara · i: bugüne kadar işleyen faiz · ib: ekstreye yansımış faiz · last: faizin işlendiği son gün */
var NA_RATE=4.25;
function tkAcc(r,d){var n=df(pd(r.last),d);if(n>0&&r.rem>0)r.i+=r.rem*r.rate/100*TAX*n/30;if(n>0)r.last=ymd(d)}   /* günlük faizi işle */
function tkRecs(cid){return (S.tk||[]).filter(function(r){return r.from===cid&&r.m=="na"&&r.rem>0.5})}
function tkNaRem(cid){return tkRecs(cid).reduce(function(a,r){return a+r.rem},0)}
/* kartın ödemesi önce en eski nakit avansı kapatır */
function tkPaid(c,x){var t=t0();tkRecs(c.id).forEach(function(r){tkAcc(r,t);var q=Math.min(r.rem,x);r.rem-=q;x-=q})}
/* kaydın maliyeti: ücret + faiz. Açık nakit avansta, kartın son ödeme gününde kapatılırsa tahmini toplam */
function tkCost(r){
  var src=card(r.from),t=t0();
  if(r.m=="tk"){var tot=r.ta*r.n-r.a;return {now:r.fee,est:r.fee+tot,int:tot}}
  var i=r.i+(r.rem>0?r.rem*r.rate/100*TAX*Math.max(0,df(pd(r.last),t))/30:0),due=src?payDay(src,pd(r.d)):t,est=i;
  if(r.rem>0.5&&due>t)est+=r.rem*r.rate/100*TAX*df(t,due)/30;
  return {now:r.fee+i,est:r.fee+est,int:i,due:due}
}
function tkSave(){
  var to=card(+val("tkTo")),fr=card(+val("tkFr")),a=num(val("tkA")),fee=num(val("tkF"))||0,m=val("tkM"),rt=num(val("tkR")),n=Math.round(num(val("tkN"))||0);
  if(!to||!fr)return "Kartları seç.";
  if(to===fr)return "Aynı kartla kendi borcunu ödeyemezsin; iki farklı kart seç.";
  if(!a||a<=0)return "Tutarı yaz.";
  if(a>to.stmt+to.cur+0.5)return esc(to.n)+" kartının borcu "+tl(to.stmt+to.cur)+"; daha fazlasını ödeyemezsin.";
  if(m=="tk"&&(n<2||n>36))return "Taksit sayısını yaz (2–36).";
  if(rt==null||rt<0)rt=NA_RATE;
  UNDO={snap:JSON.stringify(S),txt:esc(fr.n)+" → "+esc(to.n)};
  var R={id:Date.now(),d:ymd(t0()),from:fr.id,to:to.id,a:a,fee:fee,m:m,rate:rt,rem:m=="na"?a:0,i:0,ib:0,last:ymd(t0())};
  S.bal+=a;payCard(to,a);                                       /* hedef kart: borç düşer, elindeki para değişmez */
  if(m=="na"){fr.cur+=a+fee}                                    /* kaynak kart: nakit avans + ücret sonraki ekstreye */
  else{var ie=rt/100*TAX;R.n=n;R.ta=Math.ceil(ie>0?a*ie/(1-Math.pow(1+ie,-n)):a/n);fr.cur+=fee;
    S.pay.push({n:"Takla: "+to.n,a:R.ta,day:fr.sd,left:n,card:fr.id,tk:R.id})}   /* taksitler kartın ekstresine eklenir */
  S.tk=S.tk||[];S.tk.push(R);
  var C=tkCost(R);
  TKMSG="Takla kaydedildi: "+esc(to.n)+" borcundan "+tl(a)+" düştü, "+esc(fr.n)+" borcuna "+tl(a+fee)+(m=="tk"?" ("+n+" × "+tl(R.ta)+" taksit)":"")+" eklendi. Tahmini maliyet: <b>"+tl(C.est)+"</b>.";
  TKF=false;sv();return null;
}
function taklaBox(){
  if(S.cards.length<2)return "";

  L.forEach(function(r){tot+=tkCost(r).est});
  h+='<p class="lab" style="margin:0 0 8px">Bir kartın borcunu diğer kartın nakit avansıyla ödediysen buraya kaydet; borçlar kartlar arasında taşınır, maliyeti görürsün.</p>';
  if(L.length)h+='<div class="row"><span>Taklaların tahmini maliyeti</span><span><b class="num">'+tl(tot)+'</b><br><span class="lab tiny">'+L.length+' kayıt · ücret + faiz</span></span></div>';
  L.slice(0,6).forEach(function(r){var C=tkCost(r),fr=card(r.from),to=card(r.to),fn=fr?esc(fr.n):"silinen kart",tn=to?esc(to.n):"silinen kart";
    var det=r.m=="tk"?r.n+' × '+tl(r.ta)+' taksit · faiz '+tl(C.int)+(r.fee?' · ücret '+tl(r.fee):'')
      :r.rem>0.5?'Faiz işliyor: şimdiye kadar '+tl(C.int)+(r.fee?' · ücret '+tl(r.fee):'')+'<br>'+(C.due>t0()?dm(C.due)+' tarihinde '+fn+' borcunu kapatırsan toplam ~'+tl(C.est):'Son ödeme günü geçti, faiz işlemeye devam ediyor')
      :'Kapandı · faiz '+tl(C.int)+(r.fee?' · ücret '+tl(r.fee):'');
    h+='<div class="row" style="display:block"><div style="display:flex;justify-content:space-between;gap:10px"><span><b>'+fn+' → '+tn+'</b><br><span class="lab tiny">'+dm(pd(r.d))+' · '+(r.m=="tk"?'Taksitli':'Nakit avans')+'</span></span><b class="num">'+tl(r.a)+'</b></div><div class="lab tiny" style="margin-top:4px">'+det+'</div></div>'});
  if(TKF){var opt=function(sel){return S.cards.map(function(c){return '<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+esc(c.n)+' · borç '+tl(c.stmt+c.cur)+'</option>'}).join("")};
    var best=S.cards.slice().sort(function(a,b){return (b.stmt+b.cur)-(a.stmt+a.cur)})[0];
    h+='<div class="sub"><b style="display:block">Takla kaydet</b>'
     +'<label style="display:block;margin-top:10px">Borcunu ödediğin kart<select id="tkTo" style="display:block;width:100%;max-width:100%;margin-top:6px;padding:12px">'+opt(best.id)+'</select></label>'
     +'<label style="display:block;margin-top:10px">Parayı çektiğin kart<select id="tkFr" style="display:block;width:100%;max-width:100%;margin-top:6px;padding:12px">'+opt(S.cards.filter(function(c){return c!==best})[0].id)+'</select></label>'
     +'<label style="display:block;margin-top:10px">Nasıl?<select id="tkM" style="display:block;width:100%;max-width:100%;margin-top:6px;padding:12px"><option value="na">Nakit avans (tek çekim)</option><option value="tk">Taksitli nakit avans / borç transferi</option></select></label>'
     +'<div class="g2">'+fld("Tutar (TL)","tkA","","Ödediğin tutar","decimal")+fld("Ücret (TL)","tkF","","Yoksa boş bırak","decimal")
     +fld("Aylık faiz (%)","tkR","","4,25","decimal")+'<span id="tkNg" hidden>'+fld("Taksit sayısı","tkN","","Örn. 3","numeric")+'</span></div>'
     +'<p class="note" style="margin:6px 0 0">Nakit avansta faiz çektiğin gün başlar, faizsiz gün yoktur. Faizi boş bırakırsan yasal tavan (%4,25) ve vergiler kullanılır. Ücret, bankanın çekimde kestiği komisyondur.</p>'
     +'<p class="warn" id="tkE" hidden></p>'
     +'<div class="add" style="margin-top:10px"><button id="tkS">Kaydet</button><button class="ghost" id="tkC">Vazgeç</button></div></div>';
  }else h+='<button class="soft" id="tkO" style="width:100%;margin-top:8px">+ Takla kaydet</button>';
  return h+'</section>';
}
/* ---- Borçlarım: tüm kartların toplam tablosu ve "önce hangi kart" önerisi ---- */
function debtSummary(){
  var tot=0,rev=0,int=0,due=0,maxM=0,sumI=0,anyPlan=false,list=[];
  S.cards.forEach(function(c){var R=c.revS+c.revU,ik=instLeft(c.id);
    tot+=c.stmt+c.cur+ik;rev+=R;int+=R*IE(c);due+=dueNow(c);
    if(R>=1){var P=payoff(R,c.plan=="full"?"plus":c.plan,IE(c),AMR(c),c.plan=="full"?R:c.extra);if(c.plan!="full")anyPlan=true;maxM=Math.max(maxM,P.m);sumI+=P.I;list.push({c:c,R:R,rt:rateOf(c)})}});
  if(tot<1)return "";
  var h='<section class="card"><div class="hd">Borçlarım</div>'
   +'<div class="row"><span>Toplam kart borcu</span><span><b class="num">'+tl(tot)+'</b><br><span class="lab tiny">taksitler dahil, '+S.cards.length+' kart</span></span></div>'
   +(rev>=1?'<div class="row"><span>Faiz işleyen borç</span><span><b class="num">'+tl(rev)+'</b><br><span class="lab tiny">aylık ~'+tl(int)+' faiz (vergiler dahil)</span></span></div>':'')
   +(due>=1?'<div class="row"><span>Bu ekstrelerde ödenecek</span><span><b class="num">'+tl(due)+'</b></span></div>':'')
   +(rev>=1?'<div class="row"><span>Bu planlarla</span><span>~<b>'+maxM+' ayda</b> biter<br><span class="lab tiny">toplam faiz ~'+tl(sumI)+'</span></span></div>':'');
  /* öneri: fazladan ödenecek para önce en yüksek faizli karta; faizler eşitse en küçük borca (kapanınca o ödeme sıradakine) */
  if(list.length>=2){
    list.sort(function(a,b){return b.rt-a.rt||a.R-b.R});
    var f=list[0],same=list.every(function(x){return x.rt===f.rt});
    h+='<p class="note" style="margin-top:10px"><b>Fazladan ödeyeceğin para olursa</b> önce şu karta yatır: <b>'+esc(f.c.n)+'</b>. '
      +(same?'Faizler aynı, borcu en küçük olan o ('+tl(f.R)+'). Erken kapanır, sonra o ödemeyi sıradaki karta aktarırsın.'
            :'Aylık faizi en yüksek olan o (%'+String(f.rt).replace(".",",")+'); oraya ödediğin her lira seni en çok faizden kurtarır.')
      +' Diğer kartlarda asgariyi ödemeye devam et.</p>';
  }else if(list.length==1&&list[0].c.plan=="min"){
    var c1=list[0].c,a=autoPlus(list[0].R,IE(c1),AMR(c1)),P2=payoff(list[0].R,"plus",IE(c1),AMR(c1),a);
    h+='<p class="note" style="margin-top:10px">Asgari yerine her ay sabit '+tl(a)+' ödersen borç ~'+P2.m+' ayda biter, faiz ~'+tl(P2.I)+' olur.</p>';
  }
  return h+'<p class="lab tiny" style="margin:10px 0 0">Faiz ve asgari oranları Kasım 2026’da geçerli kurallara göre, yaklaşık hesaplanır. Kartının faizi farklıysa Düzenle’den yazabilirsin.</p></section>';
}
function kulOf(c){return c.lim-c.stmt-c.cur-instLeft(c.id)}                /* kartın kullanılabilir limiti */
function tipDay(){return S.inc.reduce(function(a,i){return a+i[1]},0)*(1-S.res/100)/30}   /* normal gün: aylık gelirin günlük payı */
/* bugün kartla yapılan harcamanın ödeneceği gün: bir sonraki ekstre kesiminden sonraki ilk son ödeme günü */
function payDay(c,t){var sd=null,d=t;for(var k=1;k<=70;k++){d=ad(t,k);if(!sd){if(isD(d,c.sd))sd=d}else if(isD(d,c.dd))return d}return d}
/* ---- Kartla idare ----
   Harcayacak para kalmayınca kartla, bir sonraki dönemden "öne çekerek" idare etme.
   Güvenli kart: bu harcamaların ödeneceği gün, yeni dönem başladıktan (para yattıktan) sonra olmalı.
   Otomatik günlük tutar: normal günün %35'i; kartın kullanılabilir limiti ve
   "öne çekilen toplam, yeni dönemin harcanabilir parasının %20'sini geçmesin" sınırıyla. */
function kiOptions(t,end){
  var days=Math.max(1,df(t,end)),tp=tipDay();
  return S.cards.map(function(c){var pdD=payDay(c,t),kul=kulOf(c),
    auto=Math.floor(Math.min(0.35*tp,kul/days,6*tp/days)/10)*10;
    return {c:c,pay:pdD,kul:kul,auto:Math.max(0,auto),safe:pdD>=end&&auto>=10&&!c.late}});
}
function kiDaily(){return S.ki.man!=null?S.ki.man:S.ki.auto}
function payEnd(p){var d=t0(),k=0;for(var i=1;k<p.left&&i<2000;i++){d=ad(t0(),i);if(isD(d,p.day))k++}return d}   /* son ödemenin tarihi */

/* ---- Artı Para (KMH / ek hesap) ----
   Vadesiz hesaba bağlı eksi bakiye limiti. Günlük limite KATILMAZ; ayrı, faizli kaynaktır.
   Faiz günlük işler (tavan aylık %4,25 + vergiler, TCMB Kasım 2026). Hesaba para girince borç kendiliğinden kapanır.
   S.kmh = {lim, used, i, rate}: limit · kullanılan anapara · işlemiş faiz · aylık faiz % (null = tavan)
   Limite etkisi: borç, sıradaki para günü ödenecek bir "verilecek" gibi hesaba katılır (kmhExp). */
var KMH_RATE=4.25;
function kmhDebt(){return S.kmh?S.kmh.used+S.kmh.i:0}
function kmhDay(){return S.kmh?S.kmh.used*(S.kmh.rate!=null?S.kmh.rate:KMH_RATE)/100*TAX/30:0}   /* bir günlük faiz */
function kmhNext(){var t=t0(),b=null;S.inc.forEach(function(i){if(i[1]<=0)return;for(var k=1;k<=62;k++){var x=ad(t,k);if(isD(x,i[0])){if(!b||x<b)b=x;break}}});return b}
function kmhExp(){var D=kmhDebt(),n=kmhNext();if(D<1||!n)return null;return {n:"Artı Para borcu",a:Math.round(D+kmhDay()*df(t0(),n)),d:ymd(n),o:true,kmh:1}}
function kmhBox(){
  var K=S.kmh,f=function(l,id,v,ph){return '<div class="f"><label class="lab" for="'+id+'">'+l+'</label><input id="'+id+'" inputmode="decimal" value="'+v+'" placeholder="'+(ph||"")+'"></div>'};
  var h='<section class="card"><div class="hd">Artı Para (ek hesap)</div>';
  if(K)h+='<div class="row"><span>Limit</span><span><b class="num">'+tl(K.lim)+'</b></span></div>'
    +'<div class="row"><span>Borç</span><span><b class="num">'+tl(kmhDebt())+'</b>'+(K.used>=1?'<br><span class="lab tiny">günde ~'+tl(kmhDay())+' faiz işliyor</span>':'')+'</span></div>'
    +'<div class="row"><span>Kullanılabilir</span><span><b class="num">'+tl(Math.max(0,K.lim-K.used))+'</b><br><span class="lab tiny">günlük limitine katılmaz</span></span></div>';
  else h+='<p class="lab" style="margin:-6px 0 10px">Banka hesabında eksiye düşme limitin (Artı Para, ek hesap, KMH) varsa ekle.</p>';
  h+=f("Limit (TL)","kl",K?Math.round(K.lim):"")+f("Şu an kullandığın tutar (TL)","ku",K?Math.round(kmhDebt()):"","0")
    +f("Aylık faiz (%) — bilmiyorsan boş bırak","kr",K&&K.rate!=null?nv(K.rate):"",nv(KMH_RATE))
    +'<div class="add"><button id="kmsv">Kaydet</button>'+(K?'<button class="ghost" id="kmx">Kaldır</button>':'')+'</div>'
    +'<p class="note">Artı Para günlük limitine eklenmez: faizi her gün işleyen pahalı bir borçtur (aylık en fazla %'+nv(KMH_RATE)+' + vergiler). Hesabına para girince borç kendiliğinden kapanır; uygulama sıradaki paranı buna göre azaltır.</p></section>';
  return h;
}

/* ---- Borç eritme planı ----
   Maaş yatınca asgariyi ödeyip kartla harcamaya devam eden kullanıcı için: günlük limit nakit + kart toplamıdır.
   Aylık serbest para M = gelir − tüm ödemeler − dönem gideri. Borç her ay: D + faiz(D − asgari) + 30·l − M (yaklaşık).
   S.ep = {l: günlük limit, m: hedef ay, d0: başlangıç tarihi, D0: başlangıç borcu} */
function epDebt(){return S.cards.reduce(function(a,c){return a+c.stmt+c.cur},0)}
function epM(){return S.inc.reduce(function(a,i){return a+i[1]},0)-S.pay.reduce(function(a,p){return a+p.a},0)-S.fixed}
function epRate(){var D=epDebt();if(D<1)return 0;return S.cards.reduce(function(a,c){return a+(c.stmt+c.cur)*(c.rate!=null?c.rate:tierRate(D))/100*TAX},0)/D}
function epAmr(){var D=epDebt();if(D<1)return 0.2;return S.cards.reduce(function(a,c){return a+(c.stmt+c.cur)*AMR(c)},0)/D}
function epInt(){return epDebt()*(1-epAmr())*epRate()}                       /* bu ayki yaklaşık faiz */
function epMax(){return Math.floor((epM()-epInt())/30)}                      /* bunun üstünde harcanırsa borç büyür */
/* günde l harcanırsa borç kaç ayda biter, toplam faiz (10 yılı aşarsa: bitmez) */
function epSim(l){var M=epM(),ie=epRate(),amr=epAmr(),D=epDebt(),m=0,I=0;
  while(D>=1&&m<120){var it=D*(1-amr)*ie,n=D+it+30*l-M;if(n>D-1)return {m:Infinity,I:I};I+=it;D=n;m++}
  return {m:D>=1?Infinity:m,I:I}}
/* N ayda bitiren en yüksek günlük limit (10'a yuvarlı) */
function epFor(N){var lo=0,hi=Math.max(0,epMax());if(epSim(0).m>N)return 0;
  for(var k=0;k<30;k++){var mid=(lo+hi)/2;if(epSim(mid).m<=N)lo=mid;else hi=mid}return Math.floor(lo/10)*10}
function epOpts(){var seen={},o=[];[12,18,30].forEach(function(N){var l=epFor(N);if(l>=10&&!seen[l]){seen[l]=1;var P=epSim(l);o.push({m:P.m,l:l,I:P.I})}});return o}

    ["nw","adv","revS","revU","paid"].forEach(function(k){c[k]=Math.max(0,nz(c[k],0))});if(c.rate!=null)c.rate=nz(c.rate,null);if(c.extra!=null)c.extra=nz(c.extra,null);if(c.minDue!=null)c.minDue=nz(c.minDue,null);if(c.r0!=null)c.r0=nz(c.r0,null)});

function catchUp(){

    S.inc.forEach(function(i){if(isD(c,i[0])&&i[1]>0){S.bal+=i[1];S.auto.push({d:ymd(c),k:"in",n:"Gelir",a:i[1]})}});
    if(S.kmh&&kmhDebt()>=0.5&&S.inc.some(function(i){return isD(c,i[0])&&i[1]>0})){   /* para yattı: banka önce Artı Para borcunu keser */

      if(kq>0){var kqi=Math.min(kq,S.kmh.i);S.bal-=kq;S.kmh.i-=kqi;S.kmh.used=Math.max(0,S.kmh.used-(kq-kqi));S.auto.push({d:ymd(c),k:"kmh",n:"Artı Para borcu kapandı",a:kq,p:kq-kqi})}}

      if(isD(ad(c,-1),k.dd)&&k.stmt>0){                 /* son ödeme günü geçti, borç duruyor */

        S.pay.forEach(function(p){if(p.card===k.id&&(p.left==null||p.left>0)){k.stmt+=p.a;if(p.left!=null&&!--p.left)done(p)}});   /* bu ayın taksiti ekstreye eklenir */

      }
    })}

function proj(t,R0,kal,n,kiRem){

         +(tks.length?'<ul class="tks">'+tks.map(function(p){return '<li><span>'+esc(p.n)+'</span><span>'+tl(p.a)+' × '+(p.left==null?'süresiz':p.left+' ay · son '+mY(payEnd(p)))+'</span></li>'}).join("")+'</ul>':'')
         +'<div class="inc" style="margin-top:12px"><input id="cp'+k+'" inputmode="decimal" placeholder="Ödenen tutar" value="'+(dueNow(c)>0?Math.round(dueNow(c)):"")+'" aria-label="'+esc(c.n)+' için ödenen tutar"><button data-cp="'+k+'">Borç öde</button></div><p class="warn" id="cpe'+k+'" hidden></p>'

      });

function bind(ts,t,over,pool,pl,K){
  all("[data-tab]",function(b){TAB=b.dataset.tab;DEL=null;SDY=0;show();window.scrollTo(0,0)});
  on("sdy",function(){SDY=SDY?0:1;show()});
  /* Artı Para */
  on("kmsv",function(){var l=num(val("kl")),u=num(val("ku")),r=num(val("kr"));l=Math.max(0,l||0);u=Math.max(0,u||0);if(l<1&&u<1)return;
    S.kmh={lim:Math.max(l,u),used:u,i:0,rate:r!==null&&r>0?r:null};sv();show()});
  on("kmx",function(){S.kmh=null;sv();show()});
  /* borç eritme planı */
  var epSet=function(l,m){S.ep={l:l,m:m,d0:ts,D0:epDebt()};S.ki=null;S.carry=null;S.plan=null;S.cards.forEach(function(c){c.adv=0});EPF=0;MSG2="Borç eritme planı kuruldu: günde "+tl(l)+" (nakit + kart).";TAB="bugun";sv();show();window.scrollTo(0,0)};
  on("epo",function(){EPF=1;TAB="kartlar";show();window.scrollTo(0,0)});
  on("epch",function(){EPF=1;show()});
  on("epc",function(){EPF=0;show()});
  on("epx",function(){S.ep=null;EPF=0;sv();show()});
  all("[data-epl]",function(b){epSet(+b.dataset.epl,+b.dataset.epm)});
  on("epsv",function(){var v=num(val("epm"));if(v===null||v<1)return;v=Math.floor(v);var P=epSim(v);
    if(P.m==Infinity){EPE="Günde "+tl(v)+" ile borç erimiyor. En fazla "+tl(Math.max(0,epMax()-1))+" yazabilirsin.";show();return}
    epSet(v,P.m)});
  on("bksn",function(){S.bkSn=ymd(ad(t,7));sv();show()});
  /* kendiliğinden işlenen gelir/ödeme gerçekleşmediyse geri al, "bekleyen" olarak tut */
  all("[data-au]",function(b){var x=S.auto.splice(+b.dataset.au,1)[0];if(!x)return;
    if(x.k=="in"){S.auto.filter(function(y){return y.k=="kmh"&&y.d==x.d}).forEach(function(y){S.bal+=y.a;if(S.kmh){S.kmh.used+=y.p||0;S.kmh.i+=y.a-(y.p||0)}S.auto.splice(S.auto.indexOf(y),1)});   /* gelir yatmadıysa Artı Para kapanışı da geri alınır */
      S.bal-=x.a;S.exp.push({n:"Geciken gelir",a:x.a,d:x.d,o:false});MSG2=tl(x.a)+" bakiyenden geri alındı. Yatınca “Geldi” de."}
    else{S.bal+=x.a;S.exp.push({n:x.n,a:x.a,d:x.d,o:true});MSG2=esc(x.n)+" ("+tl(x.a)+") bakiyene geri eklendi. Ödeyince “Ödedim” de."}
    sv();show()});
  /* Bugün */
  function addSpend(v,cat){
    var pm=g("pm"),c=pm&&pm.value?S.cards.filter(function(c){return String(c.id)==pm.value})[0]:null,x=SDY?{d:ymd(ad(t,-1)),a:v}:{d:ts,a:v,ts:Date.now()};
    if(cat)x.c=cat;
    if(pm&&pm.value=="kmh"&&S.kmh){                          /* Artı Para: bakiye düşmez, eksi hesap borcu artar */
      if(S.kmh.used+v>S.kmh.lim+0.5){MSG2="Artı Para limitin yetmiyor: kullanılabilir "+tl(Math.max(0,S.kmh.lim-S.kmh.used))+".";show();return}
      x.k="kmh";S.kmh.used+=v}
    else if(c){x.k=c.id;c.cur+=v;c.nw=(c.nw||0)+v;                 /* kart: bakiye düşmez, borç artar */
      if(!SDY&&K.ki&&!K.ki.stop&&c.id===K.ki.id&&K.ki.rem>0){x.adv=Math.min(v,K.ki.rem);c.adv=(c.adv||0)+x.adv}}   /* kartla idare payı: öne çekilir */
    else S.bal-=v;
    S.spend.push(x);if(SDY){SDY=0;MSG2="Dünkü harcama eklendi: "+tl(v)+"."}sv();show();
  }
  on("ad",function(){var v=num(val("a"));if(v===null||v<=0)return;addSpend(v)});
  all("[data-qa]",function(b){addSpend(+b.dataset.qa,b.dataset.qc)});
  all("[data-i]",function(b){var x=S.spend.splice(+b.dataset.i,1)[0],c=x.k!=null?card(x.k):null;
    if(x.k==="kmh"){if(S.kmh)S.kmh.used=Math.max(0,S.kmh.used-x.a)}else if(x.k==null)S.bal+=x.a;else if(c){var rr=Math.min(c.cur,x.a);c.cur-=rr;c.stmt=Math.max(0,c.stmt-(x.a-rr));c.nw=Math.max(0,(c.nw||0)-x.a);c.adv=Math.max(0,(c.adv||0)-(x.adv||0))}sv();show()});
  all("[data-j]",function(b){S.spend[+b.dataset.j].c=b.dataset.c;sv();show()});
  on("uz",function(){
    var r=num(val("ub"));if(r===null)return;
    var fark=S.bal-r;
    if(fark>0){S.spend.push({d:ts,a:fark,c:"Kayıt dışı",ts:Date.now()});MSG=tl(fark)+" kayıt dışı harcama eklendi."}
    else if(fark<0)MSG="Bakiye "+tl(-fark)+" artırıldı, harcama eklenmedi.";
    else MSG="Tam tutuyor.";
    S.bal=r;sv();show();
  });
  all("[data-m]",function(b){
    var m=b.dataset.m,ex=over-(pl?pl.over:0);
    if(m=="acil")S.resUsed+=Math.min(ex,pool);
    if(m=="yarin"){var tm=ymd(ad(t,1));S.carry={d:tm,a:(S.carry&&S.carry.d==tm?S.carry.a:0)+ex}}
    S.plan={d:ts,over:over,mode:m};sv();show();
  });
  all("[data-cm]",function(b){if(g("sb"))collect();S.cardMode=b.dataset.cm;S.cmQ=true;sv();show()});
  /* kartla idare */
  all("[data-kic]",function(b){KIC=+b.dataset.kic;show()});
  on("kis",function(){var id=+g("kis").dataset.k,o=K.opts.filter(function(o){return o.c.id===id})[0];if(!o)return;
    S.ki={card:id,end:ymd(K.end),auto:o.auto,man:null,stop:false,start:ts};KIE=false;sv();show()});
  on("kich",function(){KIE=true;show()});
  on("kix",function(){KIE=false;show()});
  on("kisv",function(){var v=num(val("kim"));if(v===null||v<0)return;S.ki.man=Math.round(v);KIE=false;sv();show()});
  on("kiau",function(){var o=kiOptions(t,K.end).filter(function(o){return o.c.id===S.ki.card})[0];if(o)S.ki.auto=o.auto;S.ki.man=null;KIE=false;sv();show()});
  on("kistop",function(){S.ki.stop=true;KIE=false;sv();show()});
  on("kire",function(){S.ki.stop=false;sv();show()});
  all("[data-wq]",function(b){S.wkFlex=b.dataset.wq=="1";S.wkQ=true;sv();show()});
  all("[data-dm]",function(b){S.defCard=b.dataset.dm?+b.dataset.dm:null;S.cardQ=true;sv();show()});
  /* Takvim */
  all("[data-cd]",function(b){document.querySelectorAll(".cal .sel").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");if(CDX[b.dataset.cd])g("cdx").innerHTML=CDX[b.dataset.cd];else g("cdx").textContent=b.getAttribute("aria-label")});
  on("ee",function(){var a=num(val("ea")),dt=val("et");if(a===null||a<=0||!dt)return;S.exp.push({n:val("en").trim(),a:a,d:dt,o:EO==1});sv();show()});
  all("[data-eo]",function(b){EO=+b.dataset.eo;show()});
  all("[data-ep]",function(b){var e=S.exp.splice(+b.dataset.ep,1)[0];S.bal-=e.a;sv();show()});
  all("[data-es]",function(b){S.exp.splice(+b.dataset.es,1);sv();show()});
  all("[data-eg]",function(b){var e=S.exp.splice(+b.dataset.eg,1)[0];S.bal+=e.a;sv();show()});
  /* Kartlar */
  on("ak",function(){CF={id:null,c:blankCard()};show();window.scrollTo(0,0)});
  all("[data-ke]",function(b){var c=S.cards[+b.dataset.ke];CF={id:c.id,c:cardToForm(c)};show();window.scrollTo(0,0)});
  all("[data-kd]",function(b){DEL=S.cards[+b.dataset.kd].id;show()});
  on("kdn",function(){DEL=null;show()});
  on("kdy",function(){
    var id=DEL;DEL=null;
    S.cards=S.cards.filter(function(c){return c.id!==id});
    if(S.ki&&S.ki.card===id)S.ki=null;
    S.pay=S.pay.filter(function(p){return p.card!==id});      /* karta bağlı taksitler de gider */
    if(S.defCard===id)S.defCard=null;
    sv();show();
  });
  on("tkO",function(){TKF=true;show();var e=g("tkTo");if(e)e.scrollIntoView({block:"center"})});
  on("tkC",function(){TKF=false;show()});
  var tm=g("tkM");if(tm)tm.onchange=function(){g("tkNg").hidden=tm.value!="tk"};
  on("tkS",function(){var e=tkSave();if(e){var w=g("tkE");w.innerHTML=e;w.hidden=false;return}show();var b=g("tkBox");if(b)b.scrollIntoView()});
  on("tkU",function(){if(UNDO){S=JSON.parse(UNDO.snap);UNDO=null;TKMSG="Takla geri alındı.";sv();show();var b=g("tkBox");if(b)b.scrollIntoView()}});
  all("[data-ct]",function(b){var e=g("ct"+b.dataset.ct);if(e)e.hidden=!e.hidden});
  all("[data-cp]",function(b){
    var c=S.cards[+b.dataset.cp],a=num(val("cp"+b.dataset.cp));if(!c||a===null||a<=0)return;
    if(Math.min(a,c.stmt+c.cur)>S.bal+0.5){var w=g("cpe"+b.dataset.cp);w.textContent="Elinde "+tl(Math.max(0,S.bal))+" görünüyor; bundan fazlasını ödeyemezsin. Paran daha fazlaysa önce Ayarlar’dan gerçek bakiyeni yaz.";w.hidden=false;return}
    payCard(c,a);sv();show()});
  all("[data-pdn]",function(b){var c=card(+b.dataset.pdn);if(!c||dueNow(c)>S.bal+0.5)return;payCard(c,dueNow(c));MSG2=esc(c.n)+" ödemesi kaydedildi.";sv();show()});
  /* Ayarlar */
  on("ai",function(){collect();S.inc.push([15,0]);sv();show()});
  all("[data-r]",function(b){collect();S.inc.splice(+b.dataset.r,1);sv();show()});
  on("ap",function(){collect();S.pay.push({n:"",a:0,day:15,left:null});sv();show()});
  all("[data-pr]",function(b){collect();var p=genPays()[+b.dataset.pr];S.pay.splice(S.pay.indexOf(p),1);sv();show()});
  on("ss",function(){collect();S.inc.sort(function(a,b){return a[0]-b[0]});MSG="";sv();show();var x=g("ss");if(x){x.textContent="Kaydedildi ✓";setTimeout(function(){if(g("ss"))g("ss").textContent="Kaydet"},1500)}});
  /* sıfırlama onayı sayfa içinde: yayınlanan sayfalarda tarayıcının confirm() penceresi engellenebiliyor */
  on("bkC",function(){bkCopy(g("bkB"))});
  on("bkU",function(){bkLoadUI(g("bkB"),true)});
  on("rs",function(){
    g("rsq").innerHTML='<div class="confirm"><b>Tüm veriler silinsin mi?</b><p class="lab" style="margin:4px 0 10px">Bakiye, harcamalar, kartlar ve ayarlar silinecek. Geri alınamaz.</p>'
     +'<div class="add"><button class="danger" id="rsy">Evet, sil</button><button class="ghost" id="rsn">Vazgeç</button></div></div>';
    on("rsn",function(){g("rsq").innerHTML=""});
    on("rsy",function(){S=null;try{localStorage.removeItem(KEY)}catch(e){}TAB="bugun";setup()});
  });
}
setInterval(tick,60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)tick()});
S=ld();if(S){mig();show()}else setup();
</script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})</script>
</body>
